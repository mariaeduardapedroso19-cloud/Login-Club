version: '3.8'
services:
  mysql-login-2:
    image: mysql:8.0
    container_name: mysql-login-2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: login_club
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  web-login:
    build: .
    container_name: web-login
    volumes:
      - ./:/var/www/html/
    ports:
      - "8002:80"
    depends_on:
      - mysql-login-2

volumes:
  db_data: